<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>For You 💕</title>
<style>
  :root{
    --pink: #ff6fa5;
    --deep-pink: #ff3d81;
    --purple: #b16cea;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    overflow-y: auto;
    font-family: 'Segoe UI', 'Comic Sans MS', 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #fff0f5, #ffe1ec, #fbd3e9);
    background-size: 400% 400%;
    animation: bgShift 12s ease infinite;
  }
  @keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #floatingHearts {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
  }
  .floater {
    position: absolute;
    bottom: -50px;
    font-size: 20px;
    opacity: 0.6;
    animation: floatUp linear infinite;
    user-select: none;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 0.7; }
    100% { transform: translateY(-110vh) translateX(20px) rotate(360deg); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px));
    overflow-x: hidden;
  }
  .hidden { display: none !important; }

  #waitingText {
    font-size: clamp(1rem, 6vw, 3rem);
    color: var(--deep-pink);
    font-weight: 700;
    min-height: 1.4em;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 12px rgba(255,61,129,0.25);
    max-width: 100%;
    word-wrap: break-word;
  }
  .letter-in {
    display: inline-block;
    opacity: 0;
    transform: translateY(15px) scale(0.7);
    animation: letterPop 0.45s forwards;
  }
  @keyframes letterPop {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .cute-btn {
    margin-top: clamp(28px, 6vw, 45px);
    padding: clamp(12px, 3.2vw, 16px) clamp(26px, 8vw, 42px);
    font-size: clamp(0.95rem, 3.6vw, 1.15rem);
    font-weight: 700;
    color: white;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(255, 61, 129, 0.35);
    opacity: 0;
    transform: scale(0.6);
    transition: transform 0.15s ease, box-shadow 0.2s ease;
    touch-action: manipulation;
    white-space: nowrap;
  }
  .cute-btn.show {
    animation: btnPop 0.6s forwards;
  }
  @keyframes btnPop {
    to { opacity: 1; transform: scale(1); }
  }
  .cute-btn:hover {
    transform: scale(1.08);
    box-shadow: 0 12px 26px rgba(255, 61, 129, 0.5);
  }
  .cute-btn:active {
    transform: scale(0.95);
  }

  #introLine {
    font-size: clamp(1rem, 3.5vw, 1.4rem);
    color: var(--purple);
    margin-bottom: 22px;
    opacity: 0;
    animation: fadeIn 1s forwards 0.2s;
    font-weight: 600;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }

  /* ---------- Heart pixel-art name ---------- */
  #nameContainer {
    display: flex;
    gap: clamp(3px, 1.5vw, 12px);
    flex-wrap: wrap;
    justify-content: center;
    max-width: 100%;
  }

  .letter-heart-grid {
    display: grid;
    grid-template-columns: repeat(5, clamp(7px, 4.6vw, 20px));
    grid-template-rows: repeat(7, clamp(7px, 4.6vw, 20px));
    gap: 1px;
  }

  .heart-cell, .empty-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(6px, 4.3vw, 18px);
    line-height: 1;
  }

  .empty-cell {
    visibility: hidden;
  }

  .heart-cell {
    opacity: 0;
    transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(0.4);
  }
  .heart-cell.fly {
    animation: pieceFly 0.65s cubic-bezier(.25,.9,.35,1.15) forwards;
  }
  @keyframes pieceFly {
    0%   { opacity: 0; transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(0.4); }
    55%  { opacity: 1; }
    100% { opacity: 1; transform: translate(0, 0) rotate(0deg) scale(1); }
  }

  #heartsBurst {
    margin-top: 32px;
    font-size: clamp(1.3rem, 4vw, 2rem);
    opacity: 0;
  }
  #heartsBurst.show {
    animation: fadeIn 0.8s forwards;
  }

  .sparkle {
    position: absolute;
    font-size: 12px;
    animation: sparklePop 0.9s ease-out forwards;
    pointer-events: none;
    z-index: 4;
  }
  @keyframes sparklePop {
    0% { opacity: 0; transform: translate(0,0) scale(0.3); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(1.1); }
  }

  footer {
    position: fixed;
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    width: 100%;
    text-align: center;
    font-size: 0.75rem;
    color: #c85f8a;
    opacity: 0.7;
    z-index: 2;
    pointer-events: none;
    padding: 0 12px;
  }

  /* ---------- Small phone / short-screen tweaks ---------- */
  @media (max-width: 380px) {
    .cute-btn { letter-spacing: 0.2px; }
    #introLine { font-size: clamp(0.8rem, 3.6vw, 1.1rem); margin-bottom: 14px; }
  }
  @media (max-height: 640px) {
    .stage { padding-top: 16px; padding-bottom: 16px; }
    .cute-btn { margin-top: 18px; }
    footer { display: none; }
  }
</style>
</head>
<body>

<div id="floatingHearts"></div>

<div class="stage" id="stage1">
  <div id="waitingText"></div>
  <button class="cute-btn" id="clickMeBtn">Click me 💗</button>
</div>

<div class="stage hidden" id="stage2">
  <div id="introLine">I LOVE YOU</div>
  <div id="nameContainer"></div>
  <div id="heartsBurst">💖 💕 💓 💞 💘 💝</div>
</div>

<!-- <footer>made with 💗 for THEARA</footer> -->

<script>
  // ---------- Floating background hearts ----------
  const floatContainer = document.getElementById('floatingHearts');
  const floatEmojis = ['💗','💕','💖','💓','💞','🩷'];
  function spawnFloater() {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = floatEmojis[Math.floor(Math.random() * floatEmojis.length)];
    el.style.left = Math.random() * 100 + 'vw';
    const duration = 6 + Math.random() * 6;
    el.style.animationDuration = duration + 's';
    el.style.fontSize = (14 + Math.random() * 18) + 'px';
    floatContainer.appendChild(el);
    setTimeout(() => el.remove(), duration * 1000 + 500);
  }
  setInterval(spawnFloater, 500);
  for (let i = 0; i < 8; i++) setTimeout(spawnFloater, i * 200);

  // ---------- Stage 1: typewriter letter animation ----------
  const waitingText = document.getElementById('waitingText');
  const message = "Ohh Nothing please wait...";
  const clickMeBtn = document.getElementById('clickMeBtn');

  function typeMessage() {
    waitingText.innerHTML = '';
    clickMeBtn.classList.remove('show');
    clickMeBtn.style.opacity = 0;
    message.split('').forEach((ch, i) => {
      const span = document.createElement('span');
      span.className = 'letter-in';
      span.style.animationDelay = (i * 0.09) + 's';
      span.textContent = ch === ' ' ? '\u00A0' : ch;
      waitingText.appendChild(span);
    });
    const totalDelay = message.length * 90 + 500;
    if (clickMeBtn._revealTimer) clearTimeout(clickMeBtn._revealTimer);
    clickMeBtn._revealTimer = setTimeout(() => {
      clickMeBtn.classList.add('show');
      clickMeBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, totalDelay);
  }

  // ---------- Stage 2: name built entirely out of heart emojis ----------
  const stage1 = document.getElementById('stage1');
  const stage2 = document.getElementById('stage2');
  const nameContainer = document.getElementById('nameContainer');
  const heartsBurst = document.getElementById('heartsBurst');
  const NAME = "THEARA";
  const heartChoices = ['💗','💕','💖','💓','💞','❤️','🩷','💘'];

  // 5x7 pixel font, 1 = heart, 0 = empty
  const FONT = {
    'T': ["11111","00100","00100","00100","00100","00100","00100"],
    'H': ["10001","10001","10001","11111","10001","10001","10001"],
    'E': ["11111","10000","10000","11110","10000","10000","11111"],
    'A': ["01110","10001","10001","11111","10001","10001","10001"],
    'R': ["11110","10001","10001","11110","10100","10010","10001"]
  };

  function randomStart() {
    const angle = Math.random() * Math.PI * 2;
    const distance = 140 + Math.random() * 160;
    return {
      x: Math.cos(angle) * distance,
      y: Math.sin(angle) * distance,
      r: (Math.random() * 360) - 180
    };
  }

  function buildNameAnimation() {
    nameContainer.innerHTML = '';
    heartsBurst.classList.remove('show');

    let globalDelayStep = 0;
    const perPieceGap = 18; // ms between each heart piece appearing

    NAME.split('').forEach((letter) => {
      const pattern = FONT[letter];
      const grid = document.createElement('div');
      grid.className = 'letter-heart-grid';

      pattern.forEach((row) => {
        row.split('').forEach((bit) => {
          if (bit === '1') {
            const cell = document.createElement('span');
            cell.className = 'heart-cell';
            cell.textContent = heartChoices[Math.floor(Math.random() * heartChoices.length)];
            const start = randomStart();
            cell.style.setProperty('--sx', start.x + 'px');
            cell.style.setProperty('--sy', start.y + 'px');
            cell.style.setProperty('--sr', start.r + 'deg');

            const delay = globalDelayStep * perPieceGap;
            setTimeout(() => {
              cell.classList.add('fly');
            }, delay);

            globalDelayStep++;
            grid.appendChild(cell);
          } else {
            const empty = document.createElement('span');
            empty.className = 'empty-cell';
            grid.appendChild(empty);
          }
        });
      });

      nameContainer.appendChild(grid);
      // small extra gap between letters so it reads letter-by-letter
      globalDelayStep += 6;
    });

    const finishDelay = globalDelayStep * perPieceGap + 500;
    if (nameContainer._revealTimer) clearTimeout(nameContainer._revealTimer);
    nameContainer._revealTimer = setTimeout(() => {
      heartsBurst.classList.add('show');
      spawnSparklesAround(nameContainer);
      heartsBurst.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, finishDelay);
  }

  function spawnSparklesAround(container) {
    const rect = container.getBoundingClientRect();
    for (let i = 0; i < 14; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = '✨';
      const x = rect.left + Math.random() * rect.width;
      const y = rect.top + Math.random() * rect.height;
      s.style.left = x + 'px';
      s.style.top = y + 'px';
      const px = (Math.random() - 0.5) * 90;
      const py = (Math.random() - 0.5) * 90 - 20;
      s.style.setProperty('--px', px + 'px');
      s.style.setProperty('--py', py + 'px');
      document.body.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  // ---------- Controls ----------
  let busy = false;
  function guardedClick(fn) {
    return () => {
      if (busy) return;
      busy = true;
      fn();
      setTimeout(() => { busy = false; }, 400);
    };
  }

  clickMeBtn.addEventListener('click', guardedClick(() => {
    stage1.classList.add('hidden');
    stage2.classList.remove('hidden');
    window.scrollTo({ top: 0, behavior: 'instant' });
    buildNameAnimation();
  }));

  // ---------- Start ----------
  typeMessage();
</script>

</body>
</html>
